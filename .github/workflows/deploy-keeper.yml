name: Deploy hashprice keeper

# Deploys the keeper twice while the oracle relay moves off Lambda (N64):
#   * deploy: code zip + env for the futures-oracle-update-v2 Lambda.
#   * deploy-service: image ghcr.io/lumerin-protocol/hashprice-oracle-keeper to
#     ECS service svc-oracle-relay-<env> (.bedrock/.terragrunt/06_oracle_relay_svc.tf).
#     Its container env is every key in config/<env>.env plus KEEPER_VERSION;
#     PRIVATE_KEY and the RPC URLs come from Secrets Manager via the task
#     definition Terraform created. vars.ORACLE_RELAY_DESIRED_COUNT (default 1)
#     sets the task count; "0" halts the service.
# The Lambda jobs go once oracle_lambda.schedule_enabled is false in every env.

on:
  push:
    branches:
      - dev
      - main
      - "cicd/**"
    paths:
      - "keeper/**"
      - "config/**"
      - ".github/workflows/deploy-keeper.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "keeper/**"
      - "config/**"
      - ".github/workflows/deploy-keeper.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, main=LMN/PROD)"
        required: true
        type: choice
        options:
          - dev
          - main

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating git tags on main
  packages: write # Push the relay image to GHCR

env:
  SERVICE_NAME: oracle-lambda-update
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/lumerin-protocol/hashprice-oracle-keeper

jobs:
  config-scope:
    name: Config scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip the other environment's config
        id: gate
        run: |
          # dev does not deploy when the only change is config/prd.env.
          # main does not deploy when the only change is config/dev.env.
          # Any other file still deploys. A manual run always deploys.
          REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$REF"
            FILES=$(git diff --name-only "origin/${REF}...HEAD")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP="config/prd.env"
          [ "$REF" = "main" ] && SKIP="config/dev.env"
          RUN=true
          if [ -n "$FILES" ] && [ -z "$(printf '%s\n' "$FILES" | grep -vx "$SKIP" || true)" ]; then
            RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "ref=$REF skip=$SKIP run=$RUN"
          printf '%s\n' "$FILES"

  build:
    name: 🔨 Build
    needs: config-scope
    if: needs.config-scope.result == 'success' && needs.config-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gen_tag.outputs.version }}
      tag: ${{ steps.gen_tag.outputs.tag_name }}
      environment: ${{ steps.gen_tag.outputs.environment }}
      lambda_function: ${{ steps.env_config.outputs.lambda_function }}
      aws_region: ${{ steps.env_config.outputs.aws_region }}
      config_env: ${{ steps.env_config.outputs.config_env }}
      env_suffix: ${{ steps.env_config.outputs.env_suffix }}
      is_cicd_branch: ${{ steps.gen_tag.outputs.is_cicd_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: gen_tag
        uses: ./.github/actions/gen-tag
        with:
          component: keeper
          major_version: "3"
          environment_override: ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.environment || '' }}

      - name: Environment config
        id: env_config
        run: |
          ENV="${{ steps.gen_tag.outputs.environment }}"
          # Lambda function name is the same across all environments (different AWS accounts)
          echo "aws_region=us-east-1" >> $GITHUB_OUTPUT
          echo "lambda_function=futures-oracle-update-v2" >> $GITHUB_OUTPUT

          # CONFIG_ENV names the config/<name>.env holding this environment's
          # public container config. GitHub environment `main` maps to prd.env.
          case "$ENV" in
            dev)
              echo "config_env=dev" >> $GITHUB_OUTPUT
              echo "env_suffix=dev" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "config_env=prd" >> $GITHUB_OUTPUT
              echo "env_suffix=lmn" >> $GITHUB_OUTPUT
              ;;
            *)
              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                echo "config_env=dev" >> $GITHUB_OUTPUT
                echo "env_suffix=dev" >> $GITHUB_OUTPUT
              else
                echo "::error::Unknown environment '$ENV' (expected dev or main). There is no config/stg.env; stg deploys are not supported."
                exit 1
              fi
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: keeper/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: keeper/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./keeper
        run: |
          echo "📦 Installing dependencies..."
          pnpm install --frozen-lockfile

      - name: Test
        working-directory: ./keeper
        run: |
          pnpm test
          pnpm typecheck

      - name: Build Lambda package
        working-directory: ./keeper
        run: |
          echo "📦 Building Lambda deployment package with esbuild..."

          # Run the build script which creates dist/index.zip
          pnpm build:lambda

          echo "✅ Package created: dist/index.zip"
          ls -lh dist/index.zip

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: keeper/dist/index.zip
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push relay image
        uses: docker/build-push-action@v7
        with:
          context: ./keeper
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.GHCR_IMAGE }}:${{ steps.gen_tag.outputs.version }}
            ${{ env.GHCR_IMAGE }}:${{ steps.gen_tag.outputs.environment }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.gen_tag.outputs.version }}

      - name: PR build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## 🔨 PR Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Build only (no deployment)" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.gen_tag.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** index.zip built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build verification successful — deploy will run on merge" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    # Declaring `environment:` makes GH emit an env-scoped OIDC sub
    # (repo:OWNER/REPO:environment:NAME) AND resolves env-scoped vars/secrets
    # (e.g. PRIVATE_KEY) before falling back to repo level. The IAM trust
    # policy in .bedrock/.terragrunt/01_github_actions_iam.tf accepts both
    # branch and environment subs, so cicd/** branch pushes still work.
    environment: ${{ needs.build.outputs.environment }}
    outputs:
      lambda_version: ${{ steps.publish.outputs.lambda_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Lambda package
        uses: actions/download-artifact@v4
        with:
          name: lambda-package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.build.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.build.outputs.aws_region }}
          role-session-name: GitHubActions-FuturesOracleUpdate-${{ github.run_id }}

      - name: Deploy to Lambda
        run: |
          echo "🚀 Deploying to ${{ needs.build.outputs.environment }} environment"
          echo "   Function: ${{ needs.build.outputs.lambda_function }}"
          echo "   Version: ${{ needs.build.outputs.version }}"

          aws lambda update-function-code \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --zip-file fileb://index.zip \
            --region ${{ needs.build.outputs.aws_region }}

          echo "✅ Code uploaded successfully"

      - name: Wait for code update to complete
        run: |
          echo "⏳ Waiting for Lambda code update to finish before updating configuration..."
          aws lambda wait function-updated \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --region ${{ needs.build.outputs.aws_region }}

          echo "✅ Code update complete"

      - name: Print Lambda environment variable keys
        run: |
          aws lambda get-function-configuration \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --region ${{ needs.build.outputs.aws_region }} \
            --query 'Environment.Variables' \
            | jq 'keys'

      - name: Update Lambda environment variables
        env:
          CONFIG: config/${{ needs.build.outputs.config_env }}.env
          BITCOIN_RPC_URL: ${{ secrets.BITCOIN_RPC_URL }}
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail

          # The function environment is every key declared in config/<env>.env
          # plus the secrets from the step env above. Sourcing cannot clobber a
          # secret, because no secret is named in the config file. jq then
          # reads values straight out of the environment, so each key is
          # written exactly once: in the config file.
          set -a && . "$CONFIG" && set +a

          KEYS=$( { sed -n 's/^[[:space:]]*\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$CONFIG"; \
                    printf '%s\n' BITCOIN_RPC_URL ETHEREUM_RPC_URL PRIVATE_KEY; } )

          # Empty values are dropped so the keeper applies its own defaults
          # instead of parsing an empty string.
          jq -n --arg keys "$KEYS" '[
            $keys
            | split("\n")
            | unique
            | .[]
            | select(. != "" and ($ENV[.] // "") != "")
            | {name: ., value: $ENV[.]}
          ]' > env-block.json

          echo "   Function env keys: $(jq -r '[.[].name] | join(", ")' env-block.json)"

          jq '{Variables: (map({(.name): .value}) | add)}' env-block.json > lambda-env.json

          aws lambda update-function-configuration \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --region ${{ needs.build.outputs.aws_region }} \
            --environment file://lambda-env.json
          echo "✅ Environment variables updated"

      - name: Wait for configuration update to complete
        run: |
          echo "⏳ Waiting for Lambda configuration update to finish..."
          aws lambda wait function-updated \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --region ${{ needs.build.outputs.aws_region }}

          echo "✅ Function updated successfully"

      - name: Publish new version
        id: publish
        run: |
          echo "📝 Publishing new Lambda version..."
          VERSION_INFO=$(aws lambda publish-version \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --description "Version ${{ needs.build.outputs.version }} - Deployed by GitHub Actions" \
            --region ${{ needs.build.outputs.aws_region }})

          LAMBDA_VERSION=$(echo $VERSION_INFO | jq -r '.Version')
          echo "lambda_version=${LAMBDA_VERSION}" >> $GITHUB_OUTPUT
          echo "✅ Published as version: ${LAMBDA_VERSION}"

  deploy-service:
    name: 🚀 Deploy relay service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    environment: ${{ needs.build.outputs.environment }}
    outputs:
      task_def_arn: ${{ steps.deploy.outputs.task_def_arn }}
      skipped: ${{ steps.svc_check.outputs.skip }}
    env:
      CLUSTER: ecs-hashprice-oracle-${{ needs.build.outputs.env_suffix }}
      SERVICE: svc-oracle-relay-${{ needs.build.outputs.env_suffix }}
      TASK_FAMILY: tsk-oracle-relay
      REGION: ${{ needs.build.outputs.aws_region }}

    steps:
      # Needed for config/<env>.env, which supplies the container environment.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.build.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.build.outputs.aws_region }}
          role-session-name: GitHubActions-OracleRelay-${{ github.run_id }}

      - name: Verify service exists
        id: svc_check
        run: |
          ACTIVE_COUNT=$(aws ecs describe-services \
            --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
            --query 'services[?status==`ACTIVE`] | length(@)' \
            --output text 2>/dev/null || echo "0")
          if [ "$ACTIVE_COUNT" = "0" ]; then
            echo "⚠️ ECS service '$SERVICE' is not ACTIVE in '$CLUSTER'. Set oracle_relay.create=true in bedrock tfvars and apply first."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Render task definition + deploy
        id: deploy
        if: steps.svc_check.outputs.skip != 'true'
        env:
          IMAGE: ${{ env.GHCR_IMAGE }}:${{ needs.build.outputs.version }}
          CONFIG: config/${{ needs.build.outputs.config_env }}.env
          KEEPER_VERSION: ${{ needs.build.outputs.version }}
          DESIRED_COUNT: ${{ vars.ORACLE_RELAY_DESIRED_COUNT || '1' }}
        run: |
          set -euo pipefail
          echo "🚀 Deploying ${IMAGE} to ${SERVICE} (desired count ${DESIRED_COUNT})"

          aws ecs describe-task-definition --task-definition "${TASK_FAMILY}" \
            --region "${REGION}" --query 'taskDefinition' > task-def.json

          # Public keys from config/<env>.env plus KEEPER_VERSION. Secret names are
          # stripped so they cannot land in the task definition environment.
          set -a && . "$CONFIG" && set +a
          KEYS=$( { sed -n 's/^[[:space:]]*\([A-Za-z_][A-Za-z0-9_]*\)=.*/\1/p' "$CONFIG"; \
                    printf '%s\n' KEEPER_VERSION; } \
                  | grep -vxE 'PRIVATE_KEY|ETHEREUM_RPC_URL|BITCOIN_RPC_URL|ALCHEMY_API_KEY' || true )

          # Empty values are dropped so the keeper applies its own defaults.
          jq -n --arg keys "$KEYS" '[
            $keys | split("\n") | unique | .[]
            | select(. != "" and ($ENV[.] // "") != "")
            | {name: ., value: $ENV[.]}
          ]' > env-block.json
          echo "   Container env keys: $(jq -r '[.[].name] | join(", ")' env-block.json)"

          # Secrets stay as Terraform defined them. /health turns 503 after 3 min
          # without progress; ECS then replaces the task.
          jq --arg IMAGE "${IMAGE}" --slurpfile env env-block.json '
            .containerDefinitions[0].image = $IMAGE |
            .containerDefinitions[0].environment = $env[0] |
            .containerDefinitions[0].healthCheck = {
              command: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1"],
              interval: 30, timeout: 5, retries: 3, startPeriod: 60
            } |
            del(.containerDefinitions[0].command, .containerDefinitions[0].entryPoint) |
            del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                .compatibilities, .registeredAt, .registeredBy)
          ' task-def.json > final-task-def.json

          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://final-task-def.json --region "${REGION}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "✅ Registered: ${NEW_TASK_DEF}"
          echo "task_def_arn=${NEW_TASK_DEF}" >> "$GITHUB_OUTPUT"

          aws ecs update-service --cluster "${CLUSTER}" --service "${SERVICE}" \
            --task-definition "${NEW_TASK_DEF}" --desired-count "${DESIRED_COUNT}" \
            --region "${REGION}" --force-new-deployment > /dev/null
          echo "✅ Deployment triggered"

      # The circuit breaker can roll a crash-looping task back and still leave the
      # service "stable", so assert the primary deployment is this revision and COMPLETED.
      - name: Verify rollout
        if: steps.svc_check.outputs.skip != 'true'
        env:
          EXPECTED_ARN: ${{ steps.deploy.outputs.task_def_arn }}
        run: |
          set -euo pipefail
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
            || echo "⚠️ stabilization wait did not succeed; inspecting state anyway"
          for _ in $(seq 1 30); do
            PRIMARY=$(aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0]' --output json)
            ROLLOUT=$(echo "$PRIMARY" | jq -r '.rolloutState // "UNKNOWN"')
            ARN=$(echo "$PRIMARY" | jq -r '.taskDefinition')
            [ "$ROLLOUT" = "COMPLETED" ] || [ "$ROLLOUT" = "FAILED" ] && break
            sleep 10
          done
          echo "Primary: ${ARN} (${ROLLOUT})"
          if [ "$ARN" != "$EXPECTED_ARN" ] || [ "$ROLLOUT" != "COMPLETED" ]; then
            echo "::error::Service did not roll forward to ${EXPECTED_ARN}"
            aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" --region "$REGION" \
              --query 'services[0].events[:10].message' --output text
            exit 1
          fi
          echo "✅ ${SERVICE} runs ${EXPECTED_ARN}"

  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: [ build, deploy ]
    if: github.event_name != 'pull_request'
    # Same env-scoped OIDC sub as the deploy job — the verify job assumes the
    # same AWS role and would otherwise fall back to a branch-scoped sub.
    environment: ${{ needs.build.outputs.environment }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.build.outputs.environment == 'dev' && secrets.AWS_ROLE_ARN_DEV || secrets.AWS_ROLE_ARN_LMN }}
          aws-region: ${{ needs.build.outputs.aws_region }}
          role-session-name: GitHubActions-FuturesOracleUpdate-Verify-${{ github.run_id }}

      - name: Test Lambda function
        run: |
          echo "🧪 Testing Lambda function..."
          aws lambda invoke \
            --function-name ${{ needs.build.outputs.lambda_function }} \
            --invocation-type DryRun \
            --region ${{ needs.build.outputs.aws_region }} \
            response.json || true

          echo "✅ Lambda function is responding"

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [ build, deploy, verify, deploy-service ]
    if: always() && needs.build.result != 'skipped' && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        if: needs.verify.result == 'success' && needs.deploy-service.result != 'failure'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: needs.verify.result == 'success' && needs.deploy-service.result != 'failure'
        run: |
          TAG_NAME="${{ needs.build.outputs.tag }}"
          echo "🏷️ Creating tag after successful deployment: $TAG_NAME"

          # Check if tag already exists
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping tag creation"
          else
            git tag -a "$TAG_NAME" -m "Release ${{ needs.build.outputs.version }} - Deployed to ${{ needs.build.outputs.environment }}"
            git push origin "$TAG_NAME"
            echo "✅ Tag $TAG_NAME created and pushed"
          fi

      - name: Deployment summary
        if: needs.verify.result == 'success' && needs.deploy-service.result != 'failure'
        run: |
          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Oracle Update Lambda" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Function:** ${{ needs.build.outputs.lambda_function }}" >> $GITHUB_STEP_SUMMARY
          echo "**Lambda Version:** ${{ needs.deploy.outputs.lambda_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Function deployed and tested successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next scheduled run:** Every 5 minutes via EventBridge" >> $GITHUB_STEP_SUMMARY

      - name: Failure summary
        if: needs.verify.result == 'failure' || needs.deploy-service.result == 'failure'
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Futures Oracle Update Lambda" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.build.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ Deployment or verification failed. Check logs above for details." >> $GITHUB_STEP_SUMMARY

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [ build, deploy, verify, deploy-service, cleanup ]
    if: always() && needs.build.result == 'success' && github.event_name !=
      'pull_request'

    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy-service.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.build.outputs.environment }}
          service_name: "Hashprice oracle keeper (Lambda + relay service)"
          version: ${{ needs.build.outputs.version }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: "${{ format('*Lambda Function:* `{0}` • *Lambda Version:*
            `{1}` • *Relay task:* `{2}`', needs.build.outputs.lambda_function,
            needs.deploy.outputs.lambda_version,
            needs.deploy-service.outputs.skipped == 'true' && 'service not created yet' || needs.deploy-service.outputs.task_def_arn) }}"
