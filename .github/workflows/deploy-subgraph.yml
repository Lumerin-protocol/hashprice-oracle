name: Deploy hashprice subgraph

on:
  push:
    branches:
      - dev
      - stg
      - main
      - "cicd/**"
    paths:
      - "indexer/**"
      - ".github/workflows/deploy-subgraph.yml"
  pull_request:
    branches:
      - dev
      - stg
      - main
    paths:
      - "indexer/**"
      - ".github/workflows/deploy-subgraph.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, stg=STG, main=LMN/PROD)"
        required: true
        type: choice
        options:
          - dev
          - stg
          - main
      graft:
        description: "Graft from the currently tagged version instead of reindexing from scratch"
        required: false
        default: false
        type: boolean
      graft_block:
        description: "Graft at this block instead of the base's head. Must be within the base's retained history (prune: auto keeps very little)."
        required: false
        default: ""
        type: string

concurrency:
  group: ci-oracles-subgraph-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating git tags

env:
  SERVICE_NAME: hashrate-and-btc-token-oracles

jobs:
  setup:
    name: 🔧 Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gen_tag.outputs.environment }}
      is_cicd_branch: ${{ steps.gen_tag.outputs.is_cicd_branch }}
      version: ${{ steps.gen_tag.outputs.version }}
      tag: ${{ steps.gen_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate version tag
        id: gen_tag
        uses: ./.github/actions/gen-tag
        with:
          component: indexer
          major_version: "3"
          environment_override: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || '' }}

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: setup
    environment: ${{ github.event_name != 'pull_request' && needs.setup.outputs.environment || '' }}
    outputs:
      version: ${{ needs.setup.outputs.version }}
      tag: ${{ needs.setup.outputs.tag }}
      environment: ${{ needs.setup.outputs.environment }}
      goldsky_subgraph_name: ${{ steps.env.outputs.goldsky_subgraph_name }}
      goldsky_rolling_tag: ${{ steps.env.outputs.goldsky_rolling_tag }}
      goldsky_endpoint: ${{ steps.env.outputs.goldsky_endpoint }}
      is_cicd_branch: ${{ needs.setup.outputs.is_cicd_branch }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: indexer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Set environment outputs
        id: env
        run: |
          ENV="${{ needs.setup.outputs.environment }}"

          # Goldsky subgraph name — override via vars.GOLDSKY_SUBGRAPH_NAME (default: hpow-oracles)
          GS_NAME="${{ vars.GOLDSKY_SUBGRAPH_NAME }}"
          if [ -z "$GS_NAME" ]; then
            GS_NAME="hpow-oracles"
          fi
          echo "goldsky_subgraph_name=$GS_NAME" >> $GITHUB_OUTPUT

          # Rolling tag and public endpoint per environment
          case $ENV in
            dev)
              echo "goldsky_rolling_tag=dev-latest" >> $GITHUB_OUTPUT
              echo "goldsky_endpoint=${{ vars.DEV_GS_ORACLES }}" >> $GITHUB_OUTPUT
              ;;
            stg)
              echo "goldsky_rolling_tag=stg-latest" >> $GITHUB_OUTPUT
              echo "goldsky_endpoint=${{ vars.STG_GS_ORACLES }}" >> $GITHUB_OUTPUT
              ;;
            main)
              echo "goldsky_rolling_tag=lmn-latest" >> $GITHUB_OUTPUT
              echo "goldsky_endpoint=${{ vars.LMN_GS_ORACLES }}" >> $GITHUB_OUTPUT
              ;;
          esac

          echo "🎯 Deploying to Goldsky: subgraph=${GS_NAME}, env=${ENV}"

      - name: Install dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      - name: Prepare subgraph configuration
        working-directory: ./indexer
        env:
          NETWORK: ${{ vars.NETWORK }}
          HASHPRICE_BTC_ADDRESS: ${{ vars.HASHPRICE_BTC_ADDRESS }}
          HASHPRICE_USD_ADDRESS: ${{ vars.HASHPRICE_USD_ADDRESS }}
          BTC_USD_ADDRESS: ${{ vars.BTC_USD_ADDRESS }}
          HASHPRICE_START_BLOCK: ${{ vars.HASHPRICE_START_BLOCK }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "ℹ️ PR build — using .env.example dummy values"
            set -a && source .env.example && set +a
          fi
          echo "⚙️ Preparing subgraph for ${{ needs.setup.outputs.environment }}..."
          echo "   Network: ${NETWORK}"
          echo "   Hashrate Oracle BTC: ${HASHPRICE_BTC_ADDRESS} (block ${HASHPRICE_START_BLOCK})"
          echo "   BTC/USD Feed:        ${BTC_USD_ADDRESS}"
          pnpm prepare:env
          echo "✅ Configuration ready"
          echo "--- subgraph.yaml ---"
          cat subgraph.yaml

      - name: Generate code and build
        working-directory: ./indexer
        run: |
          pnpm codegen
          pnpm build
          echo "✅ Build complete"

      - name: Upload build artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: subgraph-build
          path: |
            indexer/build/
            indexer/generated/
            indexer/src/
            indexer/subgraph.yaml
            indexer/schema.graphql
            contracts/abi/
          retention-days: 1

      - name: Build summary
        run: |
          echo "## 🔨 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.setup.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Subgraph | \`${{ steps.env.outputs.goldsky_subgraph_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.env.outputs.goldsky_rolling_tag }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: PR build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Build only (no deployment) — deploy will run on merge" >> $GITHUB_STEP_SUMMARY

  deploy:
    name: 🚀 Deploy to Goldsky
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    outputs:
      deploy_status: ${{ steps.goldsky_deploy.outputs.deploy_status }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: subgraph-build
          path: .

      - name: Install Goldsky CLI
        run: curl -fsSL https://goldsky.com | sh -s -- -f

      - name: Deploy and tag
        id: goldsky_deploy
        working-directory: ./indexer
        env:
          GOLDSKY_API_KEY: ${{ needs.build.outputs.environment == 'dev' && secrets.DEV_GOLDSKY_API_KEY || needs.build.outputs.environment == 'stg' && secrets.STG_GOLDSKY_API_KEY || secrets.LMN_GOLDSKY_API_KEY }}
          GOLDSKY_SUBGRAPH_NAME: ${{ needs.build.outputs.goldsky_subgraph_name }}
          SUBGRAPH_VERSION: ${{ needs.build.outputs.version }}
          GOLDSKY_ROLLING_TAG: ${{ needs.build.outputs.goldsky_rolling_tag }}
          GOLDSKY_ENDPOINT: ${{ needs.build.outputs.goldsky_endpoint }}
          GRAFT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.graft || vars.SUBGRAPH_GRAFT || 'false' }}
          # Optional pin, e.g. "v3.1.95-dev" or "hpow-oracles/v3.1.95-dev". Empty = auto-select latest.
          GRAFT_BASE_OVERRIDE: ${{ vars.SUBGRAPH_GRAFT_BASE }}
          # Optional graft block. Empty = graft at the base's head.
          GRAFT_BLOCK: ${{ github.event_name == 'workflow_dispatch' && inputs.graft_block || vars.SUBGRAPH_GRAFT_BLOCK }}
        run: |
          echo "🚀 Goldsky Subgraph Deployment"
          echo "   Subgraph:  ${GOLDSKY_SUBGRAPH_NAME}"
          echo "   Version:   ${SUBGRAPH_VERSION}"
          echo "   Tag:       ${GOLDSKY_ROLLING_TAG}"
          echo "   Graft:     ${GRAFT_ENABLED}"
          echo ""

          # `goldsky subgraph list` is scoped to the token's project — it cannot see another
          # environment's subgraphs — and renders two line shapes:
          #   * <name>/<version>
          #   * <name>/<tag> -> <name>/<version>
          GOLDSKY_LIST=/tmp/goldsky-list.txt
          deployed_versions() {
            grep -E "^\* ${GOLDSKY_SUBGRAPH_NAME}/[^ ]+$" "$GOLDSKY_LIST" \
              | sed -E "s#^\* ${GOLDSKY_SUBGRAPH_NAME}/##"
          }
          tagged_version() {
            grep -E "^\* ${GOLDSKY_SUBGRAPH_NAME}/${1} -> " "$GOLDSKY_LIST" \
              | awk '{print $4}' | head -1
          }

          # --- Resolve graft base ---
          # Grafting copies the base subgraph's data up to its latest indexed block and
          # continues from there, so additive schema changes ship without a full reindex.
          # Only additive changes are valid: new entity types and *nullable* attributes.
          GRAFT_ARGS=()
          GRAFT_BASE=""
          if [ "${GRAFT_ENABLED}" = "true" ]; then
            goldsky subgraph list --token "${GOLDSKY_API_KEY}" > "$GOLDSKY_LIST" 2>/dev/null || true

            if [ -n "${GRAFT_BASE_OVERRIDE}" ]; then
              case "${GRAFT_BASE_OVERRIDE}" in
                */*) GRAFT_BASE="${GRAFT_BASE_OVERRIDE}" ;;
                *)   GRAFT_BASE="${GOLDSKY_SUBGRAPH_NAME}/${GRAFT_BASE_OVERRIDE}" ;;
              esac
              echo "🌱 Graft base pinned by SUBGRAPH_GRAFT_BASE: ${GRAFT_BASE}"
              # Accept a tag alias as the override, but record the concrete version it maps to.
              ALIASED=$(grep -E "^\* ${GRAFT_BASE} -> " "$GOLDSKY_LIST" | awk '{print $4}' | head -1)
              if [ -n "$ALIASED" ]; then
                echo "   tag resolves to ${ALIASED}"
                GRAFT_BASE="$ALIASED"
              fi
              if ! deployed_versions | grep -qxF "${GRAFT_BASE#*/}"; then
                echo "❌ ${GRAFT_BASE} is not deployed in this project. Available:"
                deployed_versions | sed 's/^/     /'
                exit 1
              fi
            else
              # Latest deployed version of this subgraph, by version order (sort -V, so
              # v3.1.100 sorts above v3.1.95). Never pick by list position: the CLI does
              # not order by recency.
              GRAFT_VERSION=$(deployed_versions | sort -V | tail -1)
              if [ -z "$GRAFT_VERSION" ]; then
                echo "❌ Grafting requested but ${GOLDSKY_SUBGRAPH_NAME} has no deployed versions."
                echo "   Deploy once without grafting to establish a base, or pin SUBGRAPH_GRAFT_BASE."
                exit 1
              fi
              GRAFT_BASE="${GOLDSKY_SUBGRAPH_NAME}/${GRAFT_VERSION}"
              echo "🌱 Graft base auto-selected (latest of $(deployed_versions | wc -l | tr -d ' ') deployed versions): ${GRAFT_BASE}"
            fi

            # Usually the same thing; differs if a past deploy succeeded but tagging failed.
            TAGGED=$(tagged_version "${GOLDSKY_ROLLING_TAG}")
            if [ -n "$TAGGED" ] && [ "$TAGGED" != "$GRAFT_BASE" ]; then
              echo "⚠️  Tag ${GOLDSKY_ROLLING_TAG} currently serves ${TAGGED}, which is not the graft base."
            fi
            echo ""
            GRAFT_ARGS=(--graft-from "${GRAFT_BASE}")
          fi

          # --- Pre-flight: check current deployment ---
          if [ -n "${GOLDSKY_ENDPOINT}" ]; then
            echo "📊 Current deployment:"
            CURRENT=$(curl -s -X POST -H "Content-Type: application/json" \
              -d '{"query":"{ _meta { deployment hasIndexingErrors block { number } } }"}' \
              "${GOLDSKY_ENDPOINT}" 2>/dev/null || true)
            echo "   $(echo "$CURRENT" | jq -c '.data._meta // "unavailable"' 2>/dev/null || echo 'unavailable')"
            echo ""

            # A graft inherits the base's state, so refuse to build on a broken one. Query the
            # base's own endpoint rather than the tag's — they are not always the same version.
            if [ -n "${GRAFT_BASE}" ]; then
              BASE_ENDPOINT=$(echo "${GOLDSKY_ENDPOINT}" \
                | sed "s#/subgraphs/${GOLDSKY_SUBGRAPH_NAME}/[^/]*/gn#/subgraphs/${GOLDSKY_SUBGRAPH_NAME}/${GRAFT_BASE#*/}/gn#")
              BASE_META=$(curl -s -X POST -H "Content-Type: application/json" \
                -d '{"query":"{ _meta { deployment hasIndexingErrors block { number } } }"}' \
                "${BASE_ENDPOINT}" 2>/dev/null || true)
              echo "📊 Graft base ${GRAFT_BASE}:"
              echo "   $(echo "$BASE_META" | jq -c '.data._meta // "unavailable"' 2>/dev/null || echo 'unavailable')"
              echo ""
              if [ "$(echo "$BASE_META" | jq -r '.data._meta.hasIndexingErrors // "unknown"' 2>/dev/null || echo unknown)" = "true" ]; then
                echo "❌ Graft base has indexing errors — refusing to graft onto it."
                echo "   Fix the base, pin a healthy SUBGRAPH_GRAFT_BASE, or deploy without grafting."
                exit 1
              fi

              # Grafting at a past block requires the base to still hold history there.
              # `indexerHints: prune: auto` discards all but a small window, and older
              # graph-node versions accept an out-of-range graft block silently and then
              # fail at runtime with "unexpected null in handler" on every event. So probe
              # the block with a time-travel query and refuse if it has been pruned away.
              if [ -n "${GRAFT_BLOCK}" ]; then
                case "${GRAFT_BLOCK}" in
                  ''|*[!0-9]*) echo "❌ GRAFT_BLOCK '${GRAFT_BLOCK}' is not a block number."; exit 1 ;;
                esac
                PROBE=$(curl -s -X POST -H "Content-Type: application/json" \
                  -d "{\"query\":\"{ _meta(block:{number:${GRAFT_BLOCK}}) { block { number } } }\"}" \
                  "${BASE_ENDPOINT}" 2>/dev/null || true)
                PROBE_ERR=$(echo "$PROBE" | jq -r '.errors[0].message // empty' 2>/dev/null || true)
                if [ -n "$PROBE_ERR" ]; then
                  echo "❌ Cannot graft ${GRAFT_BASE} at block ${GRAFT_BLOCK}:"
                  echo "   ${PROBE_ERR}"
                  echo "   The base's history is pruned (indexerHints: prune: auto). Graft at its"
                  echo "   head by leaving GRAFT_BLOCK empty, or deploy without grafting."
                  exit 1
                fi
                echo "🌱 Grafting at block ${GRAFT_BLOCK} (verified present in base history)"
                echo ""
                GRAFT_ARGS+=(--start-block "${GRAFT_BLOCK}")
              fi
            fi
          fi

          # --- Deploy new version ---
          echo "📤 Deploying ${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}..."
          set +e
          DEPLOY_OUTPUT=$(goldsky subgraph deploy "${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}" \
            --path . \
            "${GRAFT_ARGS[@]}" \
            --token "${GOLDSKY_API_KEY}" 2>&1)
          DEPLOY_EXIT=$?
          set -e

          echo "$DEPLOY_OUTPUT"

          SKIP_DEPLOY=false
          if [ $DEPLOY_EXIT -ne 0 ]; then
            if echo "$DEPLOY_OUTPUT" | grep -qi "already exists"; then
              echo ""
              echo "ℹ️  Version ${SUBGRAPH_VERSION} already exists — skipping to tag"
              SKIP_DEPLOY=true
            elif echo "$DEPLOY_OUTPUT" | grep -qi "already deployed"; then
              CONFLICT=$(echo "$DEPLOY_OUTPUT" | grep -oP 'under the name \K\S+(?=\.)' || true)
              echo ""
              echo "⚠️  Duplicate content detected — conflicts with ${CONFLICT}"
              if [ -n "${GRAFT_BASE}" ] && [ "${CONFLICT}" = "${GRAFT_BASE}" ]; then
                echo "❌ The conflicting version is the graft base — refusing to delete it."
                echo "   Bump the version instead; deleting the base would force a full reindex."
                exit 1
              fi
              echo "   Removing conflicting version and retrying..."
              goldsky subgraph tag delete "${CONFLICT}" --tag "${GOLDSKY_ROLLING_TAG}" --token "${GOLDSKY_API_KEY}" --force 2>/dev/null || true
              goldsky subgraph delete "${CONFLICT}" --token "${GOLDSKY_API_KEY}" --force 2>/dev/null || true
              sleep 3
              echo "📤 Retrying deploy..."
              goldsky subgraph deploy "${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}" \
                --path . \
                "${GRAFT_ARGS[@]}" \
                --token "${GOLDSKY_API_KEY}"
            else
              echo ""
              echo "❌ Deployment failed"
              exit 1
            fi
          fi

          # Brief pause for Goldsky to register the new deployment
          if [ "$SKIP_DEPLOY" = "false" ]; then
            sleep 5
          fi

          # --- Roll the rolling tag ---
          echo ""
          echo "🏷️  Moving tag ${GOLDSKY_ROLLING_TAG} → ${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}"

          set +e
          TAG_OUTPUT=$(goldsky subgraph tag create "${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}" \
            --tag "${GOLDSKY_ROLLING_TAG}" \
            --token "${GOLDSKY_API_KEY}" 2>&1)
          TAG_EXIT=$?
          set -e

          if [ $TAG_EXIT -ne 0 ]; then
            echo "   Tag may exist on another version — moving it..."
            # Find the version that currently holds this tag
            OLD_TAGGED=$(resolve_tagged_versions "${GOLDSKY_ROLLING_TAG}" | head -1)
            if [ -n "$OLD_TAGGED" ]; then
              echo "   Removing tag from ${OLD_TAGGED}..."
              goldsky subgraph tag delete "${OLD_TAGGED}" \
                --tag "${GOLDSKY_ROLLING_TAG}" \
                --token "${GOLDSKY_API_KEY}" \
                --force 2>/dev/null || true
            fi
            goldsky subgraph tag create "${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}" \
              --tag "${GOLDSKY_ROLLING_TAG}" \
              --token "${GOLDSKY_API_KEY}"
          fi

          echo ""
          echo "✅ ${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION} deployed and tagged as ${GOLDSKY_ROLLING_TAG}"

          if [ "$SKIP_DEPLOY" = "true" ]; then
            echo "deploy_status=already_exists" >> $GITHUB_OUTPUT
          else
            echo "deploy_status=deployed" >> $GITHUB_OUTPUT
          fi

          echo "## 🚀 Goldsky Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Subgraph | \`${GOLDSKY_SUBGRAPH_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${SUBGRAPH_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${GOLDSKY_ROLLING_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | $([ "$SKIP_DEPLOY" = "true" ] && echo "Already existed" || echo "Deployed") |" >> $GITHUB_STEP_SUMMARY

  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: github.event_name != 'pull_request'

    steps:
      - name: Verify deployment on Goldsky
        env:
          GOLDSKY_ENDPOINT: ${{ needs.build.outputs.goldsky_endpoint }}
        run: |
          echo "🔍 Verifying subgraph on Goldsky..."
          echo "   Subgraph: ${{ needs.build.outputs.goldsky_subgraph_name }}"

          if [ -z "${GOLDSKY_ENDPOINT}" ]; then
            echo "⚠️ No Goldsky endpoint URL configured — skipping verification"
            echo "   Set DEV_GS_ORACLES / STG_GS_ORACLES / LMN_GS_ORACLES org variable"
            exit 0
          fi

          echo "   Endpoint: ${GOLDSKY_ENDPOINT}"

          # Poll for up to 60 seconds, checking every 10s
          for i in 1 2 3 4 5 6; do
            sleep 10
            echo ""
            echo "   Attempt $i/6..."

            RESPONSE=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -d '{"query": "{ _meta { block { number } deployment hasIndexingErrors } }"}' \
              "${GOLDSKY_ENDPOINT}")

            # Check for GraphQL-level errors (normal for brand-new deployments)
            if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
              echo "   Subgraph not ready yet..."
              continue
            fi

            HAS_ERRORS=$(echo "$RESPONSE" | jq -r '.data._meta.hasIndexingErrors // false')
            BLOCK_NUMBER=$(echo "$RESPONSE" | jq -r '.data._meta.block.number // "unknown"')

            echo "   Block: $BLOCK_NUMBER"
            echo "   Indexing errors: $HAS_ERRORS"

            if [ "$HAS_ERRORS" == "true" ]; then
              echo "⚠️ Subgraph has indexing errors — check Goldsky dashboard"
              exit 1
            fi

            echo "✅ Subgraph deployed and indexing on Goldsky"
            exit 0
          done

          echo "⚠️ Subgraph did not become ready within 60s — may still be syncing"
          echo "   This is normal for new deployments. Check Goldsky dashboard."
          exit 0

  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [setup, build, verify]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        if: needs.verify.result == 'success'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        if: needs.verify.result == 'success'
        run: |
          TAG_NAME="${{ needs.setup.outputs.tag }}"
          echo "🏷️ Creating tag: $TAG_NAME"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping"
          else
            git tag -a "$TAG_NAME" -m "Release ${{ needs.setup.outputs.version }} - Deployed to ${{ needs.setup.outputs.environment }}"
            git push origin "$TAG_NAME"
            echo "✅ Tag $TAG_NAME pushed"
          fi

      - name: Summary
        run: |
          if [ "${{ needs.verify.result }}" == "success" ]; then
            echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Service:** Hashrate & BTC Oracles Subgraph" >> $GITHUB_STEP_SUMMARY
            echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
            echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
            echo "**Target:** Goldsky" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check logs above for details." >> $GITHUB_STEP_SUMMARY
          fi

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [setup, build, deploy, verify, cleanup]
    if: always() && github.event_name != 'pull_request'

    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.setup.outputs.environment }}
          service_name: "Hashprice Subgraph"
          version: ${{ needs.setup.outputs.version }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: "${{ format('*Subgraph:* `{0}/{1}` → `{2}` • *Status:* {3}', needs.build.outputs.goldsky_subgraph_name, needs.build.outputs.version, needs.build.outputs.goldsky_rolling_tag, needs.deploy.outputs.deploy_status) }}"
