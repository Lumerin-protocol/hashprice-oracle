name: Deploy hashprice subgraph

# Versions are v<indexer/package.json version>-<env>-<commit>. A deploy grafts onto the version
# the rolling tag points to (else the environment's newest version of the same major) unless the
# major changed, in which case it redeploys from the start blocks and leaves the rolling tag for
# a manual `promote` once it has synced.
# A build identical to the previous version's (same major, same compiled output) is not
# deployed. Versions are never deleted. A graft onto a different HashpriceBTC fails when that
# oracle is ahead of the base's highest indexed Bitcoin height, unless `allow_gap` is set.

on:
  push:
    branches:
      - dev
      - main
      - "cicd/**"
    paths:
      - "indexer/src/**"
      - "indexer/schema.graphql"
      - "indexer/subgraph.template.yaml"
      - "indexer/package.json"
      - "indexer/pnpm-lock.yaml"
      - "indexer/integration/**"
      - "indexer/hardhat.config.ts"
      - "indexer/matchstick.yaml"
      - "contracts/abi/**"
      - "contracts/contracts/**"
      - "contracts/tests/fixtures/**"
      - "config/**"
      - ".github/workflows/deploy-subgraph.yml"
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "indexer/src/**"
      - "indexer/schema.graphql"
      - "indexer/subgraph.template.yaml"
      - "indexer/package.json"
      - "indexer/pnpm-lock.yaml"
      - "indexer/integration/**"
      - "indexer/hardhat.config.ts"
      - "indexer/matchstick.yaml"
      - "contracts/abi/**"
      - "contracts/contracts/**"
      - "contracts/tests/fixtures/**"
      - "config/**"
      - ".github/workflows/deploy-subgraph.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (dev=DEV, main=LMN/PROD)"
        required: true
        type: choice
        options:
          - dev
          - main
      graft_from:
        description: "Deploy even if unchanged, grafting from <name>/<version>, or 'none' for a full redeploy. Empty: automatic"
        required: false
        type: string
      promote:
        description: "Only move the rolling tag to this version (e.g. v4.0.0-dev-abc1234), once it has synced"
        required: false
        type: string
      allow_gap:
        description: "Graft even though the configured HashpriceBTC accepted heights the base never indexed; they stay missing"
        required: false
        type: boolean
        default: false

# Never cancel a run midway: it could stop between deploying a version and tagging it.
concurrency:
  group: ci-oracles-subgraph-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  id-token: write # Required for OIDC
  contents: write # Required for creating git tags

env:
  SERVICE_NAME: hashrate-and-btc-token-oracles
  # "false": pushes build and stop; only a manual run deploys.
  AUTO_DEPLOY: "true"

jobs:
  config-scope:
    name: Config scope
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.promote == ''
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip the other environment's config
        id: gate
        run: |
          # dev does not deploy when the only change is config/prd.env.
          # main does not deploy when the only change is config/dev.env.
          # Any other file still deploys. A manual run always deploys.
          REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "$REF"
            FILES=$(git diff --name-only "origin/${REF}...HEAD")
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            FILES=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SKIP="config/prd.env"
          [ "$REF" = "main" ] && SKIP="config/dev.env"
          RUN=true
          if [ -n "$FILES" ] && [ -z "$(printf '%s\n' "$FILES" | grep -vx "$SKIP" || true)" ]; then
            RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "ref=$REF skip=$SKIP run=$RUN"
          printf '%s\n' "$FILES"

  setup:
    name: 🔧 Setup
    needs: config-scope
    if: needs.config-scope.result == 'success' && needs.config-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.gen_tag.outputs.environment }}
      is_cicd_branch: ${{ steps.gen_tag.outputs.is_cicd_branch }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      major: ${{ steps.version.outputs.major }}
      previous: ${{ steps.version.outputs.previous }}
      previous_build_hash: ${{ steps.version.outputs.previous_build_hash }}
      graft_base: ${{ steps.version.outputs.graft_base }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine environment
        id: gen_tag
        uses: ./.github/actions/gen-tag
        with:
          component: indexer
          environment_override: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || '' }}

      - name: Version and graft base
        id: version
        env:
          ENV: ${{ steps.gen_tag.outputs.environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          PKG=$(jq -r '.version // empty' indexer/package.json)
          if ! [[ "$PKG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::indexer/package.json needs a version of the form MAJOR.MINOR.PATCH (got '${PKG}')"
            exit 1
          fi
          MAJOR="${PKG%%.*}"
          SHA7="${GITHUB_SHA::7}"
          SUFFIX="$ENV"
          [ "$GITHUB_EVENT_NAME" = "pull_request" ] && SUFFIX="pr${PR_NUMBER}"
          VERSION="v${PKG}-${SUFFIX}-${SHA7}"
          TAG="indexer-${VERSION}"

          # The environment's newest deployed version, in the current tag format or the
          # earlier v<x.y.z>-dev / v<x.y.z> (main) one.
          case "$ENV" in
            main) LEGACY_RE='^indexer-v[0-9]+\.[0-9]+\.[0-9]+$' ;;
            *) LEGACY_RE="^indexer-v[0-9]+\.[0-9]+\.[0-9]+-${ENV}\$" ;;
          esac
          CURRENT_RE="^indexer-v[0-9]+\.[0-9]+\.[0-9]+-${ENV}-[0-9a-f]{7}\$"
          PREV=$(git tag -l 'indexer-v*' --sort=-creatordate \
            | grep -E -e "$CURRENT_RE" -e "$LEGACY_RE" | grep -vx "$TAG" | head -1 || true)

          PREV_VERSION=""
          PREV_HASH=""
          GRAFT_BASE=""
          if [ -n "$PREV" ]; then
            PREV_VERSION="${PREV#indexer-}"
            PREV_HASH=$(git tag -l --format='%(contents)' "$PREV" | sed -n 's/^build-sha256: //p' | head -1)
            PREV_MAJOR=$(echo "${PREV_VERSION#v}" | cut -d. -f1)
            [ "$PREV_MAJOR" = "$MAJOR" ] && GRAFT_BASE="$PREV_VERSION"
          fi

          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "major=${MAJOR}"
            echo "previous=${PREV_VERSION}"
            echo "previous_build_hash=${PREV_HASH}"
            echo "graft_base=${GRAFT_BASE}"
          } >> "$GITHUB_OUTPUT"
          echo "version=${VERSION} previous=${PREV_VERSION:-none} graft_base=${GRAFT_BASE:-none (full redeploy)}"

  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: setup
    # The dev/main environments only admit their own branch; elsewhere, build without them.
    environment: ${{ github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'main') && needs.setup.outputs.environment || '' }}
    outputs:
      version: ${{ needs.setup.outputs.version }}
      tag: ${{ needs.setup.outputs.tag }}
      graft_base: ${{ needs.setup.outputs.graft_base }}
      environment: ${{ needs.setup.outputs.environment }}
      goldsky_subgraph_name: ${{ steps.env.outputs.goldsky_subgraph_name }}
      goldsky_rolling_tag: ${{ steps.env.outputs.goldsky_rolling_tag }}
      goldsky_endpoint: ${{ steps.env.outputs.goldsky_endpoint }}
      config_env: ${{ steps.env.outputs.config_env }}
      is_cicd_branch: ${{ needs.setup.outputs.is_cicd_branch }}
      build_hash: ${{ steps.changed.outputs.build_hash }}
      deploy: ${{ steps.changed.outputs.deploy }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: indexer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: indexer/pnpm-lock.yaml

      - name: Set environment outputs
        id: env
        run: |
          ENV="${{ needs.setup.outputs.environment }}"

          # Goldsky subgraph name — override via vars.GOLDSKY_SUBGRAPH_NAME (default: hpow-oracles)
          GS_NAME="${{ vars.GOLDSKY_SUBGRAPH_NAME }}"
          if [ -z "$GS_NAME" ]; then
            GS_NAME="hpow-oracles"
          fi
          echo "goldsky_subgraph_name=$GS_NAME" >> $GITHUB_OUTPUT

          # Rolling tag and which config file to load. The public query URL
          # is HASHPRICE_ORACLE_SUBGRAPH_URL in that file.
          case $ENV in
            dev)
              echo "goldsky_rolling_tag=dev-latest" >> $GITHUB_OUTPUT
              echo "config_env=dev" >> $GITHUB_OUTPUT
              CONFIG_ENV=dev
              ;;
            main)
              echo "goldsky_rolling_tag=lmn-latest" >> $GITHUB_OUTPUT
              echo "config_env=prd" >> $GITHUB_OUTPUT
              CONFIG_ENV=prd
              ;;
            *)
              if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
                echo "config_env=dev" >> $GITHUB_OUTPUT
              else
                echo "::error::Unknown environment '$ENV' (expected dev or main). There is no config/stg.env; stg deploys are not supported."
                exit 1
              fi
              ;;
          esac

          if [ -n "${CONFIG_ENV:-}" ]; then
            ENDPOINT=$(grep -E '^HASHPRICE_ORACLE_SUBGRAPH_URL=' "config/${CONFIG_ENV}.env" | head -1 | cut -d= -f2-)
            if [ -z "$ENDPOINT" ]; then
              echo "::error::HASHPRICE_ORACLE_SUBGRAPH_URL is missing from config/${CONFIG_ENV}.env"
              exit 1
            fi
            echo "goldsky_endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
          fi

          echo "🎯 Deploying to Goldsky: subgraph=${GS_NAME}, env=${ENV}"

      - name: Install dependencies
        working-directory: ./indexer
        run: pnpm install --frozen-lockfile

      - name: Prepare subgraph configuration
        working-directory: ./indexer
        env:
          CONFIG_ENV: ${{ steps.env.outputs.config_env }}
          DEPLOY_ENV: ${{ needs.setup.outputs.environment }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "ℹ️ PR build — using .env.example dummy values"
            ENV_FILE=.env.example
          else
            ENV_FILE="../config/${CONFIG_ENV}.env"
          fi
          echo "⚙️ Preparing subgraph for ${DEPLOY_ENV} from ${ENV_FILE}..."
          ENV_FILE="$ENV_FILE" pnpm prepare:env
          echo "✅ Configuration ready"
          echo "--- subgraph.yaml ---"
          cat subgraph.yaml

      - name: Generate code and build
        working-directory: ./indexer
        run: |
          pnpm codegen
          pnpm build
          echo "✅ Build complete"

      # The compiled output drops source comments, so a comment-only change hashes the same.
      # The major is hashed too: bumping it alone must still redeploy.
      - name: Compare with the previous version
        id: changed
        working-directory: ./indexer
        env:
          MAJOR: ${{ needs.setup.outputs.major }}
          PREVIOUS: ${{ needs.setup.outputs.previous }}
          PREVIOUS_HASH: ${{ needs.setup.outputs.previous_build_hash }}
          GRAFT_INPUT: ${{ github.event.inputs.graft_from }}
        run: |
          set -euo pipefail
          HASH=$( { echo "major=${MAJOR}"; (cd build && find . -type f | LC_ALL=C sort | xargs sha256sum); } \
            | sha256sum | cut -d' ' -f1)
          DEPLOY=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            DEPLOY=false
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$AUTO_DEPLOY" != "true" ]; then
            DEPLOY=false
            echo "::notice::AUTO_DEPLOY is off; run this workflow manually to deploy"
          elif [ -z "$GRAFT_INPUT" ] && [ "$HASH" = "$PREVIOUS_HASH" ]; then
            DEPLOY=false
            echo "::notice::Build is identical to ${PREVIOUS}; nothing to deploy"
          fi
          echo "build_hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "deploy=${DEPLOY}" >> "$GITHUB_OUTPUT"
          echo "build_hash=${HASH} previous=${PREVIOUS:-none} previous_hash=${PREVIOUS_HASH:-none} deploy=${DEPLOY}"

      - name: Upload build artifacts
        if: steps.changed.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: subgraph-build
          path: |
            indexer/build/
            indexer/generated/
            indexer/src/
            indexer/subgraph.yaml
            indexer/schema.graphql
            contracts/abi/
          retention-days: 1

      - name: Build summary
        run: |
          echo "## 🔨 Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ needs.setup.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Subgraph | \`${{ steps.env.outputs.goldsky_subgraph_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | \`${{ steps.env.outputs.goldsky_rolling_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous | \`${{ needs.setup.outputs.previous || 'none' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy | ${{ steps.changed.outputs.deploy }} |" >> $GITHUB_STEP_SUMMARY

      - name: PR build summary
        if: github.event_name == 'pull_request'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** Build only (no deployment) — deploy will run on merge" >> $GITHUB_STEP_SUMMARY

  test:
    name: 🧪 Indexer tests
    # graph-cli has Matchstick binaries for Ubuntu up to 24 only.
    runs-on: ubuntu-24.04
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: indexer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: |
            contracts/pnpm-lock.yaml
            indexer/pnpm-lock.yaml

      # The integration tests deploy the contracts from their compiled artifacts.
      - name: Compile contracts
        working-directory: ./contracts
        run: |
          pnpm install --frozen-lockfile
          pnpm compile

      - name: Run integration tests
        working-directory: ./indexer
        run: |
          pnpm install --frozen-lockfile
          pnpm test

  deploy:
    name: 🚀 Deploy to Goldsky
    runs-on: ubuntu-latest
    needs: [build, test]
    if: needs.build.outputs.deploy == 'true'
    outputs:
      deploy_status: ${{ steps.goldsky_deploy.outputs.deploy_status }}
      version_endpoint: ${{ steps.goldsky_deploy.outputs.version_endpoint }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: subgraph-build
          path: .

      - name: Install Goldsky CLI
        run: curl -fsSL https://goldsky.com | sh -s -- -f

      - name: Deploy and tag
        id: goldsky_deploy
        working-directory: ./indexer
        env:
          GOLDSKY_API_KEY: ${{ needs.build.outputs.environment == 'dev' && secrets.DEV_GOLDSKY_API_KEY || secrets.LMN_GOLDSKY_API_KEY }}
          GOLDSKY_SUBGRAPH_NAME: ${{ needs.build.outputs.goldsky_subgraph_name }}
          SUBGRAPH_VERSION: ${{ needs.build.outputs.version }}
          GOLDSKY_ROLLING_TAG: ${{ needs.build.outputs.goldsky_rolling_tag }}
          GOLDSKY_ENDPOINT: ${{ needs.build.outputs.goldsky_endpoint }}
          GRAFT_INPUT: ${{ github.event.inputs.graft_from }}
          GRAFT_BASE: ${{ needs.build.outputs.graft_base }}
          ALLOW_GAP: ${{ github.event.inputs.allow_gap == 'true' }}
        run: |
          set -euo pipefail
          # Default base: the version the rolling tag points to, which may have been deployed
          # by hand; while a new major awaits promote, the newest same-major git tag.
          case "${GRAFT_INPUT}" in
            none) GRAFT_FROM="" ;;
            "")
              GRAFT_FROM="${GRAFT_BASE:+${GOLDSKY_SUBGRAPH_NAME}/${GRAFT_BASE}}"
              TAGGED=$(goldsky subgraph list --token "${GOLDSKY_API_KEY}" 2>/dev/null \
                | awk -v alias="${GOLDSKY_SUBGRAPH_NAME}/${GOLDSKY_ROLLING_TAG}" '$2 == alias && $3 == "->" { print $4; exit }' || true)
              TAGGED_VERSION="${TAGGED#"${GOLDSKY_SUBGRAPH_NAME}"/}"
              if [ -n "${TAGGED}" ] && [ "${TAGGED_VERSION%%.*}" = "${SUBGRAPH_VERSION%%.*}" ] \
                && [ "${TAGGED_VERSION}" != "${SUBGRAPH_VERSION}" ]; then
                GRAFT_FROM="${TAGGED}"
              fi
              ;;
            *) GRAFT_FROM="${GRAFT_INPUT}" ;;
          esac
          GRAFT_ARGS=()
          [ -n "${GRAFT_FROM}" ] && GRAFT_ARGS=(--graft-from "${GRAFT_FROM}")

          VERSION_ENDPOINT="${GOLDSKY_ENDPOINT%/"${GOLDSKY_ROLLING_TAG}"/gn}/${SUBGRAPH_VERSION}/gn"
          echo "version_endpoint=${VERSION_ENDPOINT}" >> "$GITHUB_OUTPUT"

          echo "🚀 Goldsky Subgraph Deployment"
          echo "   Subgraph:  ${GOLDSKY_SUBGRAPH_NAME}"
          echo "   Version:   ${SUBGRAPH_VERSION}"
          echo "   Tag:       ${GOLDSKY_ROLLING_TAG}"
          echo "   Graft:     ${GRAFT_FROM:-none (full redeploy)}"
          echo ""

          # Point <tag> at <name>/<version>, taking it off whichever version holds it.
          # `goldsky subgraph list` renders an alias as `* <name>/<tag> -> <name>/<version>`.
          move_tag() {
            local name="$1" version="$2" tag="$3" old
            echo "🏷️  Moving tag ${tag} → ${name}/${version}"
            if goldsky subgraph tag create "${name}/${version}" --tag "${tag}" --token "${GOLDSKY_API_KEY}"; then
              return 0
            fi
            old=$(goldsky subgraph list --token "${GOLDSKY_API_KEY}" 2>/dev/null \
              | grep "${name}/" | grep "${tag}" | awk '{print $4}' | head -1 || true)
            if [ -n "${old}" ]; then
              echo "   Removing tag from ${old}..."
              goldsky subgraph tag delete "${old}" --tag "${tag}" --token "${GOLDSKY_API_KEY}" --force || true
            fi
            goldsky subgraph tag create "${name}/${version}" --tag "${tag}" --token "${GOLDSKY_API_KEY}"
          }

          meta() {
            curl -s -m 15 -X POST -H "Content-Type: application/json" \
              -d '{"query":"{ _meta { deployment hasIndexingErrors block { number } } }"}' "$1" 2>/dev/null || true
          }

          echo "📊 Current ${GOLDSKY_ROLLING_TAG}: $(meta "${GOLDSKY_ENDPOINT}" | jq -c '.data._meta // "unavailable"' 2>/dev/null || echo unavailable)"

          # --- A graft indexes only events after its block. Onto a different HashpriceBTC, the
          # heights that oracle accepted above the base's highest BtcBlock are never indexed:
          # graft before switching the keeper to it (indexer/README.md). ---
          if [ -n "${GRAFT_FROM}" ]; then
            BASE_ENDPOINT="${GOLDSKY_ENDPOINT%/"${GOLDSKY_SUBGRAPH_NAME}"/"${GOLDSKY_ROLLING_TAG}"/gn}/${GRAFT_FROM}/gn"
            ORACLE=$(sed -nE 's/^ *address: *"?(0x[0-9a-fA-F]{40})"?.*/\1/p' subgraph.yaml | head -1 | tr 'A-F' 'a-f')
            NETWORK=$(sed -nE 's/^ *network: *"?([a-z-]+)"?.*/\1/p' subgraph.yaml | head -1)
            case "${NETWORK}" in
              base) RPC_URL=https://mainnet.base.org ;;
              base-sepolia) RPC_URL=https://sepolia.base.org ;;
              *) echo "::error::No RPC for network '${NETWORK}'"; exit 1 ;;
            esac

            base_query() {
              curl -s -m 15 --retry 3 -X POST -H "Content-Type: application/json" \
                -d "{\"query\":\"$1\"}" "${BASE_ENDPOINT}" 2>/dev/null || true
            }
            # HashpriceMetaV2 since v3.6.0; older bases only have HashpriceMeta.
            BASE_ORACLE=$(base_query '{ hashpriceMetaV2S(first: 1) { hashpriceBtcAddress } }' \
              | jq -r '.data.hashpriceMetaV2S[0].hashpriceBtcAddress // empty' 2>/dev/null || true)
            if [ -z "${BASE_ORACLE}" ]; then
              BASE_ORACLE=$(base_query '{ hashpriceMetas(first: 1, orderBy: id, orderDirection: desc) { hashpriceBtcAddress } }' \
                | jq -r '.data.hashpriceMetas[0].hashpriceBtcAddress // empty' 2>/dev/null || true)
            fi

            GAP=""
            if [ "${BASE_ORACLE}" = "${ORACLE}" ]; then
              echo "🔗 ${GRAFT_FROM} already indexes ${ORACLE}: no gap"
            else
              BASE_HEIGHT=$(base_query '{ btcBlocks(first: 1, orderBy: id, orderDirection: desc) { id } }' \
                | jq -r '.data.btcBlocks[0].id // empty' 2>/dev/null || true)
              # state() returns PackedState; its first word is chainHeight, a uint32.
              STATE=$(curl -s -m 15 --retry 3 -X POST -H "Content-Type: application/json" \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"eth_call\",\"params\":[{\"to\":\"${ORACLE}\",\"data\":\"0xc19d93fb\"},\"latest\"]}" \
                "${RPC_URL}" 2>/dev/null | jq -r '.result // empty' 2>/dev/null || true)
              if [ -z "${BASE_HEIGHT}" ] || [ "${#STATE}" -lt 66 ]; then
                GAP="could not read the highest BtcBlock of ${GRAFT_FROM} (${BASE_HEIGHT:-none}) or the tip of ${ORACLE} on ${NETWORK}"
              else
                ORACLE_HEIGHT=$(( 16#${STATE:58:8} ))
                echo "🔗 ${GRAFT_FROM} indexes ${BASE_ORACLE:-an unknown oracle} up to height ${BASE_HEIGHT}; ${ORACLE} is at ${ORACLE_HEIGHT}"
                if [ "${ORACLE_HEIGHT}" -gt "${BASE_HEIGHT}" ]; then
                  GAP="${ORACLE} accepted Bitcoin heights $((BASE_HEIGHT + 1))..${ORACLE_HEIGHT} before this graft, which never indexes them"
                fi
              fi
            fi

            if [ -n "${GAP}" ]; then
              if [ "${ALLOW_GAP}" = "true" ]; then
                echo "::warning::${GAP}; deploying anyway (allow_gap). The indexer bridges gaps under 2,016 heights with approximate hashrate points."
              else
                echo "::error::${GAP}. Graft while the keeper still feeds ${BASE_ORACLE:-the old oracle}, then switch it; or rerun with allow_gap."
                exit 1
              fi
            fi
          fi

          # --- Deploy new version ---
          echo "📤 Deploying ${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}..."
          set +e
          DEPLOY_OUTPUT=$(goldsky subgraph deploy "${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION}" \
            --path . \
            "${GRAFT_ARGS[@]}" \
            --token "${GOLDSKY_API_KEY}" 2>&1)
          DEPLOY_EXIT=$?
          set -e
          echo "$DEPLOY_OUTPUT"

          STATUS=deployed
          if [ $DEPLOY_EXIT -ne 0 ]; then
            if echo "$DEPLOY_OUTPUT" | grep -qi "already exists"; then
              echo "ℹ️  ${SUBGRAPH_VERSION} already exists (re-run) — continuing to tag"
              STATUS=already_exists
            else
              echo "❌ Deployment failed"
              exit 1
            fi
          fi

          # --- A full redeploy resyncs for hours: leave the tag for a manual promote ---
          if [ -z "${GRAFT_FROM}" ]; then
            echo "deploy_status=${STATUS}_untagged" >> "$GITHUB_OUTPUT"
            echo "::notice::Full redeploy: ${GOLDSKY_ROLLING_TAG} stays put. Once ${SUBGRAPH_VERSION} has synced, run this workflow with promote=${SUBGRAPH_VERSION}."
            exit 0
          fi

          # --- A graft copies its base and catches up in minutes: wait, then tag ---
          for i in $(seq 1 60); do
            sleep 30
            NEW=$(meta "${VERSION_ENDPOINT}")
            if echo "$NEW" | jq -e '.errors' >/dev/null 2>&1 || [ -z "$NEW" ]; then
              echo "   [$i/60] not ready yet"
              continue
            fi
            if [ "$(echo "$NEW" | jq -r '.data._meta.hasIndexingErrors')" = "true" ]; then
              echo "❌ ${SUBGRAPH_VERSION} has indexing errors; ${GOLDSKY_ROLLING_TAG} not moved"
              exit 1
            fi
            NEW_BLOCK=$(echo "$NEW" | jq -r '.data._meta.block.number // empty')
            if ! [[ "$NEW_BLOCK" =~ ^[0-9]+$ ]]; then
              echo "   [$i/60] no block yet"
              continue
            fi
            HEAD_BLOCK=$(meta "${GOLDSKY_ENDPOINT}" | jq -r '.data._meta.block.number // empty' 2>/dev/null || true)
            echo "   [$i/60] ${SUBGRAPH_VERSION} at ${NEW_BLOCK}, ${GOLDSKY_ROLLING_TAG} at ${HEAD_BLOCK:-unknown}"
            if ! [[ "$HEAD_BLOCK" =~ ^[0-9]+$ ]] || [ "$NEW_BLOCK" -ge $((HEAD_BLOCK - 30)) ]; then
              move_tag "${GOLDSKY_SUBGRAPH_NAME}" "${SUBGRAPH_VERSION}" "${GOLDSKY_ROLLING_TAG}"
              echo "deploy_status=${STATUS}" >> "$GITHUB_OUTPUT"
              echo "✅ ${GOLDSKY_SUBGRAPH_NAME}/${SUBGRAPH_VERSION} deployed and tagged as ${GOLDSKY_ROLLING_TAG}"
              {
                echo "## 🚀 Goldsky Deployment"
                echo ""
                echo "| Property | Value |"
                echo "|----------|-------|"
                echo "| Subgraph | \`${GOLDSKY_SUBGRAPH_NAME}\` |"
                echo "| Version | \`${SUBGRAPH_VERSION}\` |"
                echo "| Tag | \`${GOLDSKY_ROLLING_TAG}\` |"
                echo "| Graft | \`${GRAFT_FROM}\` |"
                echo "| Status | ${STATUS} |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "❌ ${SUBGRAPH_VERSION} did not catch up within 30 minutes; ${GOLDSKY_ROLLING_TAG} not moved. Run promote=${SUBGRAPH_VERSION} once it has."
          exit 1

  verify:
    name: 🔍 Verify
    runs-on: ubuntu-latest
    needs: [build, deploy]

    steps:
      - name: Verify deployment on Goldsky
        env:
          VERSION_ENDPOINT: ${{ needs.deploy.outputs.version_endpoint }}
        run: |
          echo "🔍 Verifying ${{ needs.build.outputs.goldsky_subgraph_name }}/${{ needs.build.outputs.version }}"
          echo "   Endpoint: ${VERSION_ENDPOINT}"

          for i in 1 2 3 4 5 6; do
            RESPONSE=$(curl -s -X POST \
              -H "Content-Type: application/json" \
              -d '{"query": "{ _meta { block { number } deployment hasIndexingErrors } }"}' \
              "${VERSION_ENDPOINT}")

            # Brand-new full redeploys answer with an error until they start syncing.
            if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
              echo "   Attempt $i/6: not ready yet..."
              sleep 10
              continue
            fi

            if [ "$(echo "$RESPONSE" | jq -r '.data._meta.hasIndexingErrors // false')" == "true" ]; then
              echo "⚠️ Subgraph has indexing errors — check Goldsky dashboard"
              exit 1
            fi

            echo "✅ Indexing at block $(echo "$RESPONSE" | jq -r '.data._meta.block.number // "unknown"')"
            exit 0
          done

          echo "⚠️ Subgraph did not answer within 60s — may still be starting. Check Goldsky dashboard."
          exit 0

  cleanup:
    name: 🏷️ Tag release
    runs-on: ubuntu-latest
    needs: [setup, build, deploy, verify]
    if: always() && needs.verify.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # The build hash in the message is what the next run compares its build against.
      - name: Create and push tag
        run: |
          TAG_NAME="${{ needs.setup.outputs.tag }}"
          echo "🏷️ Creating tag: $TAG_NAME"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping"
          else
            git tag -a "$TAG_NAME" \
              -m "Release ${{ needs.setup.outputs.version }} - Deployed to ${{ needs.setup.outputs.environment }}" \
              -m "build-sha256: ${{ needs.build.outputs.build_hash }}"
            git push origin "$TAG_NAME"
            echo "✅ Tag $TAG_NAME pushed"
          fi

      - name: Summary
        run: |
          echo "## 🎉 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** Hashrate & BTC Oracles Subgraph" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.deploy.outputs.deploy_status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** Goldsky" >> $GITHUB_STEP_SUMMARY

  promote:
    name: 🏷️ Promote
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote != ''
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Goldsky CLI
        run: curl -fsSL https://goldsky.com | sh -s -- -f

      - name: Move the rolling tag
        env:
          GOLDSKY_API_KEY: ${{ github.event.inputs.environment == 'dev' && secrets.DEV_GOLDSKY_API_KEY || secrets.LMN_GOLDSKY_API_KEY }}
          ENV: ${{ github.event.inputs.environment }}
          VERSION: ${{ github.event.inputs.promote }}
        run: |
          set -euo pipefail
          GS_NAME="${{ vars.GOLDSKY_SUBGRAPH_NAME }}"
          GS_NAME="${GS_NAME:-hpow-oracles}"
          case "$ENV" in
            dev) ROLLING=dev-latest; CONFIG_ENV=dev ;;
            main) ROLLING=lmn-latest; CONFIG_ENV=prd ;;
          esac
          ENDPOINT=$(grep -E '^HASHPRICE_ORACLE_SUBGRAPH_URL=' "config/${CONFIG_ENV}.env" | head -1 | cut -d= -f2-)
          VERSION_ENDPOINT="${ENDPOINT%/"${ROLLING}"/gn}/${VERSION}/gn"
          META=$(curl -s -m 15 -X POST -H "Content-Type: application/json" \
            -d '{"query":"{ _meta { hasIndexingErrors block { number } } }"}' "${VERSION_ENDPOINT}")
          echo "${VERSION}: $(echo "$META" | jq -c '.data._meta // .errors')"
          if ! echo "$META" | jq -e '.data._meta.hasIndexingErrors == false' >/dev/null; then
            echo "::error::${VERSION} is not serving cleanly; ${ROLLING} not moved"
            exit 1
          fi
          # Point <tag> at <name>/<version>, taking it off whichever version holds it.
          # `goldsky subgraph list` renders an alias as `* <name>/<tag> -> <name>/<version>`.
          move_tag() {
            local name="$1" version="$2" tag="$3" old
            echo "🏷️  Moving tag ${tag} → ${name}/${version}"
            if goldsky subgraph tag create "${name}/${version}" --tag "${tag}" --token "${GOLDSKY_API_KEY}"; then
              return 0
            fi
            old=$(goldsky subgraph list --token "${GOLDSKY_API_KEY}" 2>/dev/null \
              | grep "${name}/" | grep "${tag}" | awk '{print $4}' | head -1 || true)
            if [ -n "${old}" ]; then
              echo "   Removing tag from ${old}..."
              goldsky subgraph tag delete "${old}" --tag "${tag}" --token "${GOLDSKY_API_KEY}" --force || true
            fi
            goldsky subgraph tag create "${name}/${version}" --tag "${tag}" --token "${GOLDSKY_API_KEY}"
          }
          move_tag "${GS_NAME}" "${VERSION}" "${ROLLING}"
          echo "✅ ${ROLLING} → ${GS_NAME}/${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  notify:
    name: 📢 Notify
    runs-on: ubuntu-latest
    needs: [setup, build, test, deploy, verify, cleanup]
    if: always() && needs.setup.result != 'skipped' && github.event_name != 'pull_request'

    steps:
      - name: Checkout (for composite action)
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.verify.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "failure" ] || [ "${{ needs.deploy.result }}" == "failure" ] || [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.test.result }}" == "failure" ]; then
            echo "status=failure" >> $GITHUB_OUTPUT
          elif [ "${{ needs.verify.result }}" == "cancelled" ] || [ "${{ needs.deploy.result }}" == "cancelled" ]; then
            echo "status=cancelled" >> $GITHUB_OUTPUT
          else
            echo "status=skipped" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack notification
        if: needs.build.outputs.deploy == 'true' || steps.status.outputs.status == 'failure'
        uses: ./.github/actions/slack-notify
        with:
          status: ${{ steps.status.outputs.status }}
          environment: ${{ needs.setup.outputs.environment }}
          service_name: "Hashprice Subgraph"
          version: ${{ needs.setup.outputs.version }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_info: "${{ format('*Subgraph:* `{0}/{1}` → `{2}` • *Status:* {3}', needs.build.outputs.goldsky_subgraph_name, needs.build.outputs.version, needs.build.outputs.goldsky_rolling_tag, needs.deploy.outputs.deploy_status) }}"
