# pnpm 11 reads build permissions from here; the package.json "pnpm" field is
# ignored. The three testcontainers dependencies were already being skipped
# under pnpm 10 and each has a pure-JS fallback, so keep them off.
allowBuilds:
  cpu-features: false
  matchstick-as: true
  protobufjs: false
  ssh2: false
  # git-hosted; must run their prepare/build scripts to compile from source.
  # Keyed on the resolved tarball URL, so these stay pinned to the commit the
  # v0.4.2 tag points at even though package.json depends on the tag.
  esbuild: true
  matchstick-ts@https://codeload.github.com/lsheva/matchstick-ts/tar.gz/d613d674898f6d0d01a880dd4e1b514f707b93b9#path:packages/matchstick-ts: true
  hardhat-matchstick-ts@https://codeload.github.com/lsheva/matchstick-ts/tar.gz/d613d674898f6d0d01a880dd4e1b514f707b93b9#path:packages/hardhat-matchstick-ts: true
