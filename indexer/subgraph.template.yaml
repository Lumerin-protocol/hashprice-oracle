# Use subgraph.template.yaml to add changes to the subgraph.yaml file
# Variables are substituted via envsubst from environment variables
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Hashprice
    network: "${NETWORK}"
    source:
      address: "${HASHPRICE_USD_ADDRESS}"
      startBlock: ${HASHPRICE_START_BLOCK}
      abi: AggregatorV3Interface
    context:
      hashpriceUsdAddress:
        type: String
        data: "${HASHPRICE_USD_ADDRESS}"
      btcUsdAddress:
        type: String
        data: "${BTC_USD_ADDRESS}"
      hashpriceBtcAddress:
        type: String
        data: "${HASHPRICE_BTC_ADDRESS}"
      hashpriceStartBlock:
        type: BigInt
        data: "${HASHPRICE_START_BLOCK}"
      hashpricePollingBlockInterval:
        type: BigInt
        data: "${HASHPRICE_POLLING_BLOCK_INTERVAL}"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Rates
      abis:
        - name: HashpriceBTC
          file: ../contracts/abi/HashpriceBTC.json
        - name: AggregatorV3Interface
          file: ../contracts/abi/AggregatorV3Interface.json
      blockHandlers:
        - handler: handleBlock
          filter:
            kind: polling
            every: ${HASHPRICE_POLLING_BLOCK_INTERVAL}
        - handler: initHashpriceMeta
          filter:
            kind: once

      file: ./src/hashprice.ts
  - kind: ethereum
    name: HashpriceBTC
    network: "${NETWORK}"
    source:
      address: "${HASHPRICE_BTC_ADDRESS}"
      startBlock: ${HASHPRICE_START_BLOCK}
      abi: HashpriceBTC
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/hashprice.ts
      entities:
        - Rates
      abis:
        - name: HashpriceBTC
          file: ../contracts/abi/HashpriceBTC.json
      eventHandlers:
        - handler: handleHashpriceUpdated
          event: "HashpriceUpdated(indexed uint32,int256,uint256)"

# Required when deploying with `goldsky subgraph deploy ... --graft-from <name>/<version>`
features:
  - grafting
