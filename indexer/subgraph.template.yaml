# Use subgraph.template.yaml to add changes to the subgraph.yaml file
# Variables are substituted via envsubst from environment variables
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: HashpriceBTC
    network: "${NETWORK}"
    source:
      address: "${HASHPRICE_BTC_ADDRESS}"
      startBlock: ${HASHPRICE_START_BLOCK}
      abi: HashpriceBTC
    context:
      hashpriceUsdAddress:
        type: String
        data: "${HASHPRICE_USD_ADDRESS}"
      btcUsdAddress:
        type: String
        data: "${BTC_USD_ADDRESS}"
      hashpriceBtcAddress:
        type: String
        data: "${HASHPRICE_BTC_ADDRESS}"
      hashpriceStartBlock:
        type: BigInt
        data: "${HASHPRICE_START_BLOCK}"
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/hashprice.ts
      entities:
        - HashpriceBtc
        - HashpriceUsd
        - HashpriceMeta
        - LatestRates
        - BtcBlock
        - ChainReorgEvent
        - NetworkHashrate1d
        - NetworkHashrate7d
      abis:
        - name: HashpriceBTC
          file: ../contracts/abi/HashpriceBTC.json
        - name: AggregatorV3Interface
          file: ../contracts/abi/AggregatorV3Interface.json
        - name: AggregatorProxy
          file: ../contracts/abi/AggregatorProxy.json
        - name: AggregatorV2V3Interface
          file: ../contracts/abi/AggregatorV2V3Interface.json
      blockHandlers:
        - handler: initFeeds
          filter:
            kind: once
      eventHandlers:
        # Emitted once per reorg, ahead of every BlockSubmitted of the winning fork.
        - handler: handleChainReorg
          event: "ChainReorg(indexed bytes32,indexed uint32,uint32,bytes32,uint32)"
        # Emitted once per validated header, before that block's HashpriceUpdated, so
        # BtcBlock rows are always in place by the time the hashprice handler reads them.
        # A batched submission interleaves the two, one pair per block.
        - handler: handleBlockSubmitted
          event: "BlockSubmitted(indexed bytes32,indexed uint32,uint64,uint32,uint32)"
        - handler: handleHashpriceUpdated
          event: "HashpriceUpdated(indexed uint32,int256,uint256)"
          calls:
            aggregator: AggregatorProxy[${BTC_USD_ADDRESS}].aggregator()

templates:
  - kind: ethereum
    name: ChainlinkAggregator
    network: "${NETWORK}"
    source:
      abi: AggregatorV2V3Interface
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - BtcUsd
        - HashpriceUsd
        - LatestRates
      abis:
        - name: AggregatorV2V3Interface
          file: ../contracts/abi/AggregatorV2V3Interface.json
      eventHandlers:
        - handler: handleAnswerUpdated
          event: "AnswerUpdated(indexed int256,indexed uint256,uint256)"
      file: ./src/hashprice.ts

# Required when deploying with `goldsky subgraph deploy ... --graft-from <name>/<version>`
features:
  - grafting
