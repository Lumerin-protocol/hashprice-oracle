# Ephemeral stack for `pnpm seed:generate` (Testcontainers).
# No bind-mounted data volumes — containers are disposable.

services:
  graph-node:
    image: graphprotocol/graph-node:v0.41.1
    ports:
      - "8000"
      - "8020"
    depends_on:
      - ipfs
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      postgres_host: postgres
      postgres_user: graph-node
      postgres_pass: let-me-in
      postgres_db: graph-node
      ipfs: "ipfs:5001"
      ethereum: "${SUBGRAPH_ETH_NODE}"
      GRAPH_LOG: info
      ETHEREUM_REORG_THRESHOLD: "1"
      ETHEREUM_ANCESTOR_COUNT: "1"
  ipfs:
    image: ipfs/kubo:v0.17.0
    ports:
      - "5001"
  postgres:
    image: postgres:14
    ports:
      - "5432"
    command:
      [
        "postgres",
        "-cshared_preload_libraries=pg_stat_statements",
        "-cmax_connections=200",
      ]
    environment:
      POSTGRES_USER: graph-node
      POSTGRES_PASSWORD: let-me-in
      POSTGRES_DB: graph-node
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graph-node -d graph-node"]
      interval: 3s
      timeout: 5s
      retries: 20
