# Price feed entities

type LatestRates @entity(immutable: false) {
  id: Int8!

  hashpriceBtcId: Int8
  hashpriceBtcPrice: BigInt
  hashpriceBtcUpdatedAt: BigInt
  hashpriceBtcBlockNumber: BigInt

  networkHashrate1dId: Int8
  networkHashrate1dHpS: BigInt
  networkHashrate1dUpdatedAt: BigInt
  networkHashrate1dBlockNumber: BigInt

  networkHashrate7dId: Int8
  networkHashrate7dHpS: BigInt
  networkHashrate7dUpdatedAt: BigInt
  networkHashrate7dBlockNumber: BigInt

  btcUsdId: Int8
  btcUsdPrice: BigInt
  btcUsdUpdatedAt: BigInt
  btcUsdBlockNumber: BigInt
  btcUsdAggregator: Bytes
}

type HashpriceMeta @entity(immutable: true) {
  id: Int8!
  hashpriceUsdAddress: Bytes!
  hashpriceBtcAddress: Bytes!
  btcUsdAddress: Bytes!
  hashpriceUsdDecimals: Int8!
  hashpriceBtcDecimals: Int8!
  btcUsdDecimals: Int8!
  startBlock: BigInt!
}

type HashpriceUsd @entity(timeseries: true) {
  id: Int8!
  price: BigInt!
  timestamp: Timestamp! # maximal timestamp of the two contributing feeds
  minTimestamp: Timestamp! # minimal timestamp of the two contributing feeds
  blockNumber: BigInt!
}

type HashpriceBtc @entity(timeseries: true) {
  id: Int8!
  price: BigInt!
  timestamp: Timestamp!
  blockNumber: BigInt!
  # Bitcoin block height the price was derived from, which is also the oracle's
  # Chainlink roundId. graph-node assigns `id` itself for timeseries entities, so
  # this has to be its own field to be queryable.
  confirmedHeight: BigInt!
  # 144-block SMA of transaction fees in satoshis, as reported by the event.
  avgFees: BigInt!
}

# Per-Bitcoin-block bookkeeping needed to estimate the actual network hashrate.
# Not a timeseries: rows are keyed by Bitcoin height and rewritten when a reorg
# replaces that height, which keeps `cumulativeWork` consistent with the canonical chain.
type BtcBlock @entity(immutable: false) {
  id: Int8! # Bitcoin block height
  # Header hash in internal (little-endian) byte order, as the contract stores it.
  # Reverse the bytes to get the form block explorers display.
  blockHash: Bytes!
  btcTimestamp: BigInt! # raw header timestamp (nTime)
  # Median of the 11 timestamps h-10..h — Bitcoin Core's GetMedianTimePast, the
  # `mediantime` field of `getblock`. Null until 11 consecutive blocks are known.
  medianTime: BigInt
  nBits: BigInt!
  # Total value of the coinbase transaction's outputs, in satoshis, exactly as the header
  # claimed it. Kept raw because it is the only unrecoverable figure: `fees` below saturates.
  coinbaseValue: BigInt!
  # coinbaseValue - subsidy(height), floored at zero. Zero therefore means either a block
  # with no fee revenue or a miner that underpaid itself; `coinbaseValue` distinguishes them.
  fees: BigInt!
  # Full 256-bit difficulty target expanded from nBits.
  target: BigInt!
  # diff1Target / target, truncated to an integer as the contract computes it. At mainnet
  # difficulty (~1e14) the truncation is immaterial.
  difficulty: BigInt!
  # Hashrate implied by this block's difficulty alone, assuming Bitcoin's 600s target
  # interval: expected work / 600. This is the "difficulty-implied" figure quoted by most
  # explorers, and is a property of the target rather than a measurement — for hashrate
  # actually observed over a window, use NetworkHashrate1d / NetworkHashrate7d.
  impliedHashrateHpS: BigInt!
  # Sum of expected hashes (2^256 / (target + 1)) over every block up to and including
  # this one, counting from `chainBaseHeight`. Derived from the parent row, never from a
  # global running total, so a reorg recomputes it correctly as fork blocks are re-indexed.
  cumulativeWork: BigInt!
  # Oldest height reachable from here by an unbroken chain of parent rows. A window of W
  # blocks ending at h is only measurable when h - W >= chainBaseHeight.
  chainBaseHeight: Int8!
}

# One row per accepted reorg. Purely a record: the canonical BtcBlock rows are already
# correct without it, because the contract re-emits BlockSubmitted for every block of the
# winning fork and each row is rewritten in place. This exists so reorg frequency and
# depth are queryable, and so the displaced tip is recoverable after the fact.
type ChainReorgEvent @entity(timeseries: true) {
  id: Int8!
  timestamp: Timestamp!
  blockNumber: BigInt!
  newTip: Bytes! # winning fork's tip hash, internal byte order
  newHeight: BigInt!
  ancestorHeight: BigInt! # last height common to both chains; everything above was replaced
  oldTip: Bytes! # displaced tip hash, internal byte order
  oldHeight: BigInt!
  # oldHeight - ancestorHeight: how many blocks the reorg displaced. A same-height reorg
  # driven by cumulative work rather than length still has depth >= 1.
  depth: Int8!
}

# Actual Bitcoin network hashrate, estimated as the expected work of the trailing 144 blocks
# divided by the median-time-past elapsed over that window. This is the same estimator
# blockchain.com charts; median time past is used instead of raw header timestamps because
# miner clocks are only loosely constrained by consensus.
#
# 144 blocks ≈ 24 hours.
type NetworkHashrate1d @entity(timeseries: true) {
  id: Int8!
  # Hashes per second. Divide by 1e18 for EH/s, the unit hashrate is usually quoted in.
  hashrateHpS: BigInt!
  timestamp: Timestamp!
  blockNumber: BigInt!
  confirmedHeight: BigInt!
  # medianTime(h) - medianTime(h - 144); the divisor, kept so the number can be audited and
  # so luck is readable directly — it sits near 86400 but drifts with block-interval variance.
  elapsedSeconds: BigInt!
}

# 1008 blocks ≈ 7 days. Same estimator as NetworkHashrate1d over a longer window, which
# blockchain.com recommends reading instead of the daily series because block discovery is
# a Poisson process and a 24h sample is dominated by luck.
type NetworkHashrate7d @entity(timeseries: true) {
  id: Int8!
  # Hashes per second, as on NetworkHashrate1d.
  hashrateHpS: BigInt!
  timestamp: Timestamp!
  blockNumber: BigInt!
  confirmedHeight: BigInt!
  # medianTime(h) - medianTime(h - 1008); sits near 604800.
  elapsedSeconds: BigInt!
}

type BtcUsd @entity(timeseries: true) {
  id: Int8!
  price: BigInt!
  timestamp: Timestamp!
  blockNumber: BigInt!
}

# Candle aggregations

type HashpriceUsdCandle @aggregation(intervals: ["hour", "day"], source: "HashpriceUsd") {
  id: Int8!

  high: BigInt! @aggregate(fn: "max", arg: "price")
  low: BigInt! @aggregate(fn: "min", arg: "price")
  sum: BigInt! @aggregate(fn: "sum", arg: "price")
  count: BigInt! @aggregate(fn: "count", arg: "price")

  timestamp: Timestamp!
}

